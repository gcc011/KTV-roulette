<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120b0e">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="麦浪点唱：选一个曲风，转动转盘，随机选出今晚的 KTV 第一首歌。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="麦浪点唱">
  <title>麦浪点唱 · KTV 转盘点歌</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-mic" viewBox="0 0 24 24">
      <rect x="9" y="2.5" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M5.8 11.5a6.2 6.2 0 0 0 12.4 0M12 17.8V21M9 21h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M12 5.5v5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24">
      <path d="M4 7h11M4 12h8M4 17h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M21 16V7.5l-4 1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-shuffle" viewBox="0 0 24 24">
      <path d="M4 7h2.4c4.2 0 5.4 10 9.6 10H20M17 14l3 3-3 3M4 17h2.4c1.5 0 2.6-1.3 3.7-3M14.2 7H20M17 4l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4.5V11h-6.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="8" y="8" width="11" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-8A2.5 2.5 0 0 0 3 6.5v9A2.5 2.5 0 0 0 5.5 18H8" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M4.5 7h15M9 7V4.8h6V7M6.5 7l.8 12.2h9.4L17.5 7M10 10.5v5M14 10.5v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-sparkle" viewBox="0 0 24 24">
      <path d="M12 2.8c.5 5.6 2.6 7.7 8.2 8.2-5.6.5-7.7 2.6-8.2 8.2-.5-5.6-2.6-7.7-8.2-8.2 5.6-.5 7.7-2.6 8.2-8.2z" fill="currentColor"/>
    </symbol>
  </svg>

  <div class="ambient" aria-hidden="true">
    <span class="ambient-blob ambient-blob--red"></span>
    <span class="ambient-blob ambient-blob--gold"></span>
    <span class="ambient-grain"></span>
  </div>

  <div class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="麦浪点唱首页">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-mic"/></svg>
        </span>
        <span class="brand-word">
          <strong>麦浪点唱</strong>
          <small>MAILANG KTV</small>
        </span>
      </a>
      <div class="top-actions">
        <button class="icon-button sound-button" id="soundButton" type="button" aria-pressed="true" aria-label="关闭音效" title="关闭音效">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.2h3.2L12 5.5v13l-4.8-3.7H4z" fill="currentColor"/>
            <path class="sound-wave" d="M15.2 8.6a5 5 0 0 1 0 6.8M17.8 6.2a8.3 8.3 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path class="sound-off" d="M15.5 9.2l5 5.6M20.5 9.2l-5 5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="library-button" id="openLibrary" type="button" aria-haspopup="dialog" aria-controls="librarySheet" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-list"/></svg>
          <span>歌单</span>
          <span class="queue-badge" id="queueBadge">0</span>
        </button>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="heroTitle">
        <p class="eyebrow"><span class="eyebrow-dot"></span>KTV RANDOM PICKER · 今晚开嗓</p>
        <div class="hero-row">
          <h1 id="heroTitle">今晚，<span class="gold-text">唱什么？</span></h1>
          <div class="hero-stamp" aria-hidden="true">
            <span>SING</span>
            <svg viewBox="0 0 24 24"><use href="#icon-mic"/></svg>
            <span>TONIGHT</span>
          </div>
        </div>
        <p class="hero-sub">选一个曲风，把选择困难交给转盘。</p>
      </section>

      <nav class="category-chips" id="categoryChips" aria-label="选择曲风"></nav>

      <section class="stage-section" aria-label="选歌转盘">
        <div class="stage-topline">
          <p class="stage-count"><span class="status-dot"></span>本轮 <b id="candidateCount">20</b> 首候选</p>
          <button class="refresh-button" id="refreshButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-shuffle"/></svg>
            换一批
          </button>
        </div>

        <div class="wheel-stage" id="wheelStage">
          <div class="stage-aura" aria-hidden="true"></div>
          <div class="bulbs" id="bulbs" aria-hidden="true"></div>

          <div class="wheel-shell">
            <div class="wheel" id="wheel">
              <canvas id="wheelCanvas" role="img" aria-label="候选歌曲转盘"></canvas>
            </div>
            <span class="wheel-shine" aria-hidden="true"></span>
          </div>

          <div class="pointer" aria-hidden="true">
            <span class="pointer-gem"></span>
            <span class="pointer-arrow"></span>
          </div>

          <button class="spin-hub" id="spinButton" type="button" aria-describedby="wheelHint">
            <span class="hub-ring" aria-hidden="true"></span>
            <span class="hub-content">
              <span class="hub-label" id="spinLabel">开转</span>
              <span class="hub-sub" id="spinSub">SPIN</span>
            </span>
          </button>
        </div>

        <p class="spin-hint" id="wheelHint"><span aria-hidden="true"></span>轻触中心开转 · 喝口水，准备开嗓</p>
      </section>

      <section class="result-card" id="resultCard" aria-live="polite" aria-atomic="true">
        <span class="result-orbit" aria-hidden="true"></span>
        <div class="result-topline">
          <span class="result-flag"><span class="result-flag-dot"></span><span id="resultKicker">READY TO SING</span></span>
          <span class="result-category" id="resultCategory" hidden></span>
        </div>
        <div class="result-copy">
          <h2 id="resultTitle">第一首，从转盘开始</h2>
          <p id="resultMeta">曲库已就位，选好曲风就开转。</p>
        </div>
        <div class="result-actions" id="resultActions" hidden>
          <button class="btn-save" id="saveButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-plus"/></svg>
            <span>加入今晚歌单</span>
          </button>
          <button class="btn-again" id="againButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-refresh"/></svg>
            再转
          </button>
          <button class="btn-icon" id="copyButton" type="button" aria-label="复制歌名与歌手" title="复制歌名">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-copy"/></svg>
          </button>
        </div>
      </section>

      <footer class="footer">
        <span class="footer-line"></span>
        <p>麦浪点唱 · 把今晚交给一点点运气</p>
        <span class="footer-line"></span>
      </footer>
    </main>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>

  <section class="library-sheet" id="librarySheet" role="dialog" aria-modal="true" aria-labelledby="libraryTitle" tabindex="-1" hidden>
    <span class="sheet-grab" aria-hidden="true"></span>
    <header class="sheet-header">
      <div>
        <p class="sheet-eyebrow">YOUR SINGING LIST</p>
        <h2 id="libraryTitle">我的点歌台</h2>
      </div>
      <button class="sheet-close" id="closeLibrary" type="button" aria-label="关闭点歌台">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-close"/></svg>
      </button>
    </header>

    <div class="sheet-tabs" role="tablist" aria-label="点歌台内容">
      <button class="sheet-tab" id="queueTab" type="button" role="tab" aria-selected="true" aria-controls="queuePanel" data-tab="queue">
        今晚歌单 <span id="queueTabCount">0</span>
      </button>
      <button class="sheet-tab" id="customTab" type="button" role="tab" aria-selected="false" aria-controls="customPanel" data-tab="custom">
        自选歌曲 <span id="customTabCount">0</span>
      </button>
    </div>

    <div class="sheet-content">
      <section class="sheet-panel" id="queuePanel" role="tabpanel" aria-labelledby="queueTab">
        <div class="queue-list" id="queueList"></div>
        <div class="sheet-footer" id="queueFooter" hidden>
          <button class="btn-copy-all" id="copyQueueButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-copy"/></svg>
            复制整份歌单
          </button>
          <button class="btn-clear" id="clearQueueButton" type="button">清空</button>
        </div>
      </section>

      <section class="sheet-panel" id="customPanel" role="tabpanel" aria-labelledby="customTab" hidden>
        <form class="custom-form" id="customForm">
          <div class="form-grid">
            <label class="field">
              <span>歌名</span>
              <input id="customTitle" name="title" type="text" maxlength="24" placeholder="例如：晴天" autocomplete="off" required>
            </label>
            <label class="field">
              <span>歌手 <em>选填</em></span>
              <input id="customArtist" name="artist" type="text" maxlength="24" placeholder="例如：周杰伦" autocomplete="off">
            </label>
          </div>
          <button class="btn-add" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-plus"/></svg>
            添加到「我的」
          </button>
        </form>
        <p class="form-tip">自选歌曲会出现在「我的」曲风里，也能被转盘选中。</p>
        <div class="custom-list" id="customList"></div>
      </section>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">请开启 JavaScript，转盘才能转起来。</div>
  </noscript>

  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
